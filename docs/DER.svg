<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790">
<defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#2d4260;font-size:14px}.title{font-size:25px;font-weight:700;fill:#142743}.head{font-size:17px;fill:white;font-weight:600}.note{font-size:12px;fill:#7086a3}.line{fill:none;stroke:#527cb4;stroke-width:2}.box{fill:#fff;stroke:#cedbee;stroke-width:1.5}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#527cb4"/></marker></defs>
<rect width="1120" height="790" fill="#f3f6fb"/><text x="40" y="48" class="title">SENATI · Entidad–Relación · APIDB</text><text x="40" y="73" class="note">Laboratorio 9 · Cinco tablas InnoDB · FK obligatorias · DELETE RESTRICT / UPDATE CASCADE</text>
<g transform="translate(40,120)"><rect class="box" width="260" height="160" rx="10"/><rect width="260" height="40" rx="8" fill="#1c4179"/><text x="18" y="27" class="head">Categorias</text><text x="18" y="68">PK id · INT</text><text x="18" y="94">UK nombre · VARCHAR(120)</text><text x="18" y="120">descripcion · TEXT</text><text x="18" y="144" class="note">createdAt / updatedAt</text></g>
<g transform="translate(40,355)"><rect class="box" width="260" height="220" rx="10"/><rect width="260" height="40" rx="8" fill="#1c4179"/><text x="18" y="27" class="head">Proveedores</text><text x="18" y="68">PK id · INT</text><text x="18" y="94">razon_social · VARCHAR(255)</text><text x="18" y="120">contacto · VARCHAR(255)</text><text x="18" y="146">telefono · VARCHAR(40)</text><text x="18" y="172">email · VARCHAR(255)</text><text x="18" y="201" class="note">createdAt / updatedAt</text></g>
<g transform="translate(420,120)"><rect class="box" width="270" height="270" rx="10"/><rect width="270" height="40" rx="8" fill="#235ad7"/><text x="18" y="27" class="head">Productos</text><text x="18" y="68">PK id · INT</text><text x="18" y="94">nombre · VARCHAR(255)</text><text x="18" y="120">descripcion · TEXT</text><text x="18" y="146">precio · DECIMAL(10,2)</text><text x="18" y="172">stock · INT · default 0</text><text x="18" y="198">FK categoriaId · INT</text><text x="18" y="224">FK proveedorId · INT</text><text x="18" y="252" class="note">createdAt / updatedAt</text></g>
<g transform="translate(420,470)"><rect class="box" width="270" height="215" rx="10"/><rect width="270" height="40" rx="8" fill="#1c4179"/><text x="18" y="27" class="head">Usuarios</text><text x="18" y="68">PK id · INT</text><text x="18" y="94">nombre · VARCHAR(255)</text><text x="18" y="120">UK email · VARCHAR(255)</text><text x="18" y="146">password · hash scrypt</text><text x="18" y="172">rol · ENUM</text><text x="18" y="199" class="note">createdAt / updatedAt</text></g>
<g transform="translate(800,245)"><rect class="box" width="280" height="350" rx="10"/><rect width="280" height="40" rx="8" fill="#157e80"/><text x="18" y="27" class="head">Movimientos</text><text x="18" y="68">PK id · INT</text><text x="18" y="94">FK productoId · INT</text><text x="18" y="120">FK usuarioId · INT</text><text x="18" y="146">tipo_movimiento · ENUM</text><text x="18" y="172">cantidad · INT positivo</text><text x="18" y="198">fecha_hora · DATETIME</text><text x="18" y="224">observaciones · TEXT</text><text x="18" y="250">stock_anterior · INT</text><text x="18" y="276">stock_resultante · INT</text><text x="18" y="322" class="note">createdAt / updatedAt</text></g>
<path class="line" d="M300 200 H355 V318 H420" marker-end="url(#arrow)"/><text x="310" y="191" class="note">1 → N</text><path class="line" d="M300 460 H375 V344 H420" marker-end="url(#arrow)"/><text x="309" y="483" class="note">1 → N</text><path class="line" d="M690 250 H745 V339 H800" marker-end="url(#arrow)"/><text x="700" y="240" class="note">1 → N</text><path class="line" d="M690 550 H756 V365 H800" marker-end="url(#arrow)"/><text x="705" y="574" class="note">1 → N</text>
<text x="40" y="747" class="note">Las flechas apuntan de la entidad padre (1) a la hija (N). Historial inmutable; stock y movimiento se guardan atómicamente.</text></svg>
